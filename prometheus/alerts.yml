groups:
  - name: infrastructure
    rules:

      # =========================
      # Service Down
      # =========================
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}"

      # =========================
      # High CPU Usage
      # =========================
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 2 minutes"

      # =========================
      # High Memory Usage
      # =========================
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80%"

      # =========================
      # Low Disk Space
      # =========================
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15%"

      # =========================
      # Container High Memory
      # =========================
      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{id=~"/docker/.*"} > 500000000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container memory usage is high"
          description: "A container is using more than 500MB RAM"

      # =========================
      # Container High CPU
      # =========================
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{id=~"/docker/.*"}[5m]) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU usage is high"
          description: "A container CPU usage exceeded 80%"